name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The suite drives ONE shared demoblaze account (the cart is keyed by
# username), so two workflow runs overlapping would corrupt each other's
# cart state — queue them instead of running in parallel.
concurrency:
  group: demoblaze-shared-account
  cancel-in-progress: false

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  e2e:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci

      # Test history accumulates across runs: restore the newest previous
      # snapshot (restore-keys prefix match), append this run's results via
      # the after:spec hook in cypress.config.ts, then save under a fresh
      # run-scoped key below.
      - name: Restore test history
        uses: actions/cache/restore@v4
        with:
          path: cypress/reports/history.jsonl
          key: test-history-${{ github.run_id }}
          restore-keys: |
            test-history-

      - name: Run Cypress
        run: npm test
        env:
          CYPRESS_USERNAME: ${{ secrets.CYPRESS_USERNAME }}
          CYPRESS_PASSWORD: ${{ secrets.CYPRESS_PASSWORD }}

      - name: Save test history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: cypress/reports/history.jsonl
          key: test-history-${{ github.run_id }}

      - name: Upload test history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-history
          path: cypress/reports/history.jsonl
          retention-days: 90

      - name: Upload mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-report
          path: cypress/reports/html
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 14
